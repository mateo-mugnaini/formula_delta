services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      FORMULA_DELTA_HOST: 0.0.0.0
      FORMULA_DELTA_PORT: 3000
      F1_SIGNALR_URL: ${F1_SIGNALR_URL}
      F1_SIGNALR_TOPICS: ${F1_SIGNALR_TOPICS}
      FORMULA_DELTA_LOG_LEVEL: ${FORMULA_DELTA_LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    volumes:
      - ./api/recordings:/app/recordings
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  client:
    build:
      context: ./client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
